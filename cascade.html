<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Note Cascade · Marble Melodies</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171e22;color:#e8e5dc;font:15px system-ui}main{max-width:850px;margin:auto}header{padding:14px 18px 10px}a{color:#bfcacb;font-size:13px}h1{font:29px Georgia;margin:12px 0 6px}p{margin:4px 0;color:#aebbbc;line-height:1.5}canvas{display:block;width:100%;aspect-ratio:900/1000;background:#333f43}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px max(18px,env(safe-area-inset-bottom));background:#20292d}button{border:1px solid #627378;border-radius:24px;background:#37484b;color:white;font:15px system-ui;padding:11px 18px}#play{background:#d8b16d;color:#20292d;border-color:#d8b16d}label{font-size:13px;color:#c1ccca;display:flex;align-items:center;gap:7px}input{width:100px;accent-color:#d8b16d}#status{font-size:12px;color:#c2ceca;padding:0 18px 12px}@media(min-width:700px){canvas{max-height:76vh;width:auto;max-width:100%;margin:auto}}</style></head>
<body><main><header><a href="./index.html">← All Marble Melodies machines</a><h1>Note Cascade</h1><p>The Star-Spangled Banner · two marbles, two winding courses, melody and harmony.</p></header><canvas width="900" height="1000" aria-label="Two distinct marbles bounce down separate winding sets of musical bouncers, playing anthem melody and harmony together"></canvas><div class="controls"><button id="play">Release marbles</button><button id="reset">Back to top</button><label>Tempo <input id="speed" aria-label="Anthem tempo" type="range" min="0.5" max="1.5" step="0.1" value="1"></label><button id="mute" aria-pressed="false">Mute</button></div><div id="status" role="status">The Star-Spangled Banner · ready</div></main>
<script>
(()=>{'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d'),play=document.querySelector('#play'),status=document.querySelector('#status');
// The Star-Spangled Banner: traditional melody, original synthesized performance.
const melody=[[69,0.75],[66,0.25],[62,1],[66,1],[69,1],[74,2],[78,0.75],[76,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.5],[73,0.5],[74,1],[74,1],[69,1],[66,1],[62,2],[69,0.75],[66,0.25],[62,1],[66,1],[69,1],[74,2],[78,0.75],[76,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.5],[73,0.5],[74,1],[74,1],[69,1],[66,1],[62,2],[78,0.75],[78,0.25],[78,1],[79,1],[81,1],[81,2],[79,0.75],[78,0.25],[76,1],[78,1],[79,1],[79,2],[79,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.75],[73,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[74,1],[74,1],[74,0.5],[73,0.5],[71,1],[71,1],[71,1],[76,1],[79,0.5],[78,0.5],[76,0.5],[74,0.5],[74,1],[73,1],[69,0.75],[69,0.25],[74,1.5],[76,0.5],[78,0.5],[79,0.5],[81,2],[74,0.75],[76,0.25],[78,1.5],[79,0.5],[76,1],[74,3]];
const pitchNames=['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'];
const layout=[620,305,715,475,190,605,320,650];
const pads=melody.map(([note,beats],i)=>({x:layout[i%8]+Math.sin(i*.9)*18,y:150+i*105,angle:[-.42,.34,-.48,-.24,.46,-.38,.42,-.32][i%8],name:pitchNames[note%12]+(Math.floor(note/12)-1),note,beats,hit:-100}));
const harmonyIntervals={2:5,4:3,6:4,7:5,8:4,9:3,11:4,1:4};
const harmony=pads.map((p,i)=>{let note=p.note-(harmonyIntervals[p.note%12]||4);if(i===pads.length-1)note=p.note-12;return{...p,note,name:pitchNames[note%12]+(Math.floor(note/12)-1),angle:-p.angle,hit:-100}});
const lanes=[pads,harmony];
const laneX=(x,lane)=>lane?900-(x*.45+10):x*.45+10;
const r=17,endY=pads[pads.length-1].y+120;
const anchors=[{x:425,y:28},...pads.map(p=>({x:p.x,y:p.y-r})),{x:465,y:endY}];
const beatSeconds=60/84;
const durations=[.8,...melody.slice(0,-1).map(n=>n[1]*beatSeconds),melody[melody.length-1][1]*beatSeconds+.6];
const heights=durations.map((d,i)=>i===0?0:Math.min(125,35+d*65));
const arrivals=[];let total=0;durations.forEach((d,i)=>{total+=d;if(i<pads.length)arrivals.push(total)});
let time=0,last=null,running=false,finished=false,struck=0,sound=true,ac=null,splashAge=-1;
function position(t){let from=0;for(let i=0;i<durations.length;i++){if(t<=from+durations[i]||i===durations.length-1){let u=Math.max(0,Math.min(1,(t-from)/durations[i])),a=anchors[i],b=anchors[i+1];return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u-heights[i]*4*u*(1-u)}}from+=durations[i]}}
function line(ax,ay,bx,by,col,w=2){g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function disk(x,y,r,col){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=col;g.fill()}
function ellipse(x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill()}
function draw(){let bg=g.createLinearGradient(0,0,900,1000);bg.addColorStop(0,'#4d6065');bg.addColorStop(.5,'#293b43');bg.addColorStop(1,'#14262f');g.fillStyle=bg;g.fillRect(0,0,900,1000);
let ball=position(time),camera=Math.max(0,Math.min(endY-820,ball.y-390));g.save();g.translate(0,-camera);
for(let lane=0;lane<2;lane++){let course=lanes[lane];for(let i=0;i<course.length;i++){let p=course[i];if(p.y<camera-100||p.y>camera+1100)continue;let px=laneX(p.x,lane);let age=time-p.hit,hit=age>=0&&age<.7?Math.sin(age*19)*Math.exp(-age*6):0;g.save();g.translate(px,p.y+8);g.rotate(p.angle);g.scale(.78,.85);ellipse(12,29,60,15,'#0b1c2555');
// Exposed spring and round tilted bouncer replace the ladder-like flat steps.
line(-28,10,-28,30,'#82969a',4);line(28,10,28,30,'#82969a',4);g.beginPath();for(let k=0;k<=14;k++){let x=-25+k*50/14,y=25+(k%2?5:-5);if(k)g.lineTo(x,y);else g.moveTo(x,y)}g.strokeStyle='#d0c39c';g.lineWidth=2;g.stroke();ellipse(0,33,43,8,'#627980');g.translate(0,hit*8);ellipse(0,0,56,18,'#bd8956');ellipse(0,-5,56,18,'#f0c682');ellipse(0,-7,45,12,lane?'#435c89':'#8f6045');ellipse(-3,-9,38,9,age>=0&&age<.3?'#ffe6ac':lane?'#9ebee0':'#d4ac75');line(-36,-13,24,-13,'#fff0cb77',1);g.restore();
g.font='16px Georgia';g.fillStyle=age>=0&&age<.5?'#ffe6a5':'#d4dfd7';g.textAlign=lane?'left':'right';g.fillText(p.name,px+(lane?61:-61),p.y+7);
if(age>=0&&age<.45){g.strokeStyle='#f7ce7b';g.lineWidth=2;g.beginPath();g.arc(px,p.y-r,23+age*55,Math.PI*1.1,Math.PI*1.9);g.stroke()}}}
for(let lane=0;lane<2;lane++){let bowlX=laneX(465,lane);ellipse(bowlX,endY+24,65,12,'#1b3039');ellipse(bowlX,endY+20,65,11,'#8fa8ab');ellipse(bowlX,endY+16,53,7,'#438b9a');ellipse(bowlX-9,endY+14,32,3,'#a9e9e477');
let base=position(time),p={x:laneX(base.x,lane),y:base.y};g.save();g.shadowColor='#06131f88';g.shadowBlur=10;g.shadowOffsetX=8;g.shadowOffsetY=13;let glass=g.createRadialGradient(p.x-6,p.y-8,1,p.x,p.y,r);glass.addColorStop(0,'#f2ffff');glass.addColorStop(.25,lane?'#ffbe8e':'#75e3dc');glass.addColorStop(.7,lane?'#b95259':'#24869d');glass.addColorStop(1,'#b5e1da');disk(p.x,p.y,r,glass);g.restore();g.save();g.beginPath();g.arc(p.x,p.y,r-1,0,Math.PI*2);g.clip();g.translate(p.x,p.y);g.rotate(time*5);g.strokeStyle=lane?'#ffe7bb':'#eac369';g.lineWidth=6;g.beginPath();g.ellipse(0,0,8,19,.7,0,Math.PI*2);g.stroke();g.restore();disk(p.x-6,p.y-8,4,'#ffffffdd');g.textAlign='left';drawSplash(laneX(465,lane));}g.restore();g.fillStyle='#dce7df';g.font='14px system-ui';g.textAlign='center';g.fillText('MELODY · teal marble',225,24);g.fillText('HARMONY · coral marble',675,24);g.textAlign='left'}
// Real-time splash animation continues after the music and marble stop.
function drawSplash(cx){if(splashAge<0||splashAge>2.8)return;let t=splashAge,cy=endY+16,fade=Math.max(0,1-t/2.8);g.save();
for(let i=0;i<4;i++){let age=t-i*.11;if(age<0)continue;g.globalAlpha=Math.max(0,1-age/1.8)*.7;g.beginPath();g.ellipse(cx,cy+3,35+age*105,7+age*16,0,0,Math.PI*2);g.strokeStyle=i%2?'#efffff':'#6ddff0';g.lineWidth=3;g.stroke()}
// Wide translucent crown erupts around the landing marble.
if(t<1.1){let u=t/1.1,h=Math.sin(Math.PI*Math.sqrt(u))*150,w=28+u*110;g.globalAlpha=(1-u)*.8;g.beginPath();g.moveTo(cx-47,cy);g.quadraticCurveTo(cx-w,cy-h*.45,cx-w*.85,cy-h);g.quadraticCurveTo(cx-25,cy-h*.6,cx,cy-8);g.quadraticCurveTo(cx+25,cy-h*.6,cx+w*.85,cy-h);g.quadraticCurveTo(cx+w,cy-h*.45,cx+47,cy);g.closePath();g.fillStyle='#85e9f1';g.fill();g.strokeStyle='#d9ffff';g.lineWidth=2;g.stroke()}
for(let i=0;i<86;i++){let seed=Math.sin(i*127.1+19)*43758.5453,rand=seed-Math.floor(seed),angle=-Math.PI*.94+(i%23)/22*Math.PI*.88,speed=135+rand*255,delay=(i%5)*.018,age=t-delay;if(age<0)continue;let x=cx+Math.cos(angle)*speed*age,y=cy+Math.sin(angle)*speed*age+220*age*age;if(y>cy+12&&age>.3)continue;g.globalAlpha=fade*Math.min(1,age*18);g.save();g.translate(x,y);g.rotate(Math.atan2(Math.sin(angle)*speed+440*age,Math.cos(angle)*speed));ellipse(0,0,3+rand*4,2+rand*2,i%3?'#8ae9f0':'#efffff');g.restore()}
g.restore()}
function splashSound(){if(!sound||!ac)return;let duration=.7,buffer=ac.createBuffer(1,Math.ceil(ac.sampleRate*duration),ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);let source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();source.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(2800,ac.currentTime);filter.frequency.exponentialRampToValueAtTime(400,ac.currentTime+duration);gain.gain.setValueAtTime(.22,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+duration);source.connect(filter).connect(gain).connect(ac.destination);source.start();source.stop(ac.currentTime+duration)}
function chime(n,beats=1,level=1){if(!sound||!ac)return;let z=ac.currentTime,f=440*2**((n-69)/12);for(const [m,a,d] of [[1,.28,Math.max(1.2,beats*beatSeconds*.95)],[2,.07,.5],[3,.02,.25]]){let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f*m;v.gain.setValueAtTime(.0001,z);v.gain.exponentialRampToValueAtTime(a*level,z+.005);v.gain.exponentialRampToValueAtTime(.0001,z+d);o.connect(v).connect(ac.destination);o.start(z);o.stop(z+d+.01)}}
function reset(){splashAge=-1;time=0;struck=0;finished=false;running=false;lanes.forEach(course=>course.forEach(p=>p.hit=-100));play.textContent='Release marbles';status.textContent='The Star-Spangled Banner · tap Release marbles'}
function frame(ms){let dt=last===null?0:Math.min(.04,(ms-last)/1000);last=ms;if(splashAge>=0)splashAge+=dt;if(running){time=Math.min(total,time+dt*Number(document.querySelector('#speed').value));while(struck<pads.length&&time>=arrivals[struck]){pads[struck].hit=arrivals[struck];harmony[struck].hit=arrivals[struck];chime(pads[struck].note,pads[struck].beats,.82);chime(harmony[struck].note,harmony[struck].beats,.48);status.textContent=pads[struck].name+' + '+harmony[struck].name+' · duet '+(struck+1)+' of '+pads.length;struck++}if(time>=total){running=false;finished=true;splashAge=0;splashSound();play.textContent='Play duet again';status.textContent='Splash! · The Star-Spangled Banner · finished'}}draw();requestAnimationFrame(frame)}
play.onclick=async()=>{if(finished)reset();try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){}running=!running;play.textContent=running?'Pause':'Continue';if(!running)status.textContent='Paused'};document.querySelector('#reset').onclick=reset;document.querySelector('#mute').onclick=()=>{sound=!sound;document.querySelector('#mute').textContent=sound?'Mute':'Sound on';document.querySelector('#mute').setAttribute('aria-pressed',String(!sound))};reset();requestAnimationFrame(frame);
})();

</script></body></html>
