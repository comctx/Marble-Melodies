function cymbalAccent(when,final=false){if(!ac)return;const duration=final?1.05:.42,buffer=ac.createBuffer(1,Math.ceil(ac.sampleRate*duration),ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*(final?.24:.09)));const source=ac.createBufferSource(),filter=ac.createBiquadFilter(),v=ac.createGain();source.buffer=buffer;filter.type='highpass';filter.frequency.value=3800;v.gain.setValueAtTime(final?.075:.045,when);v.gain.exponentialRampToValueAtTime(.0001,when+duration);source.connect(filter).connect(v).connect(master);track(source);source.start(when);source.stop(when+duration)}
function splashSound(){if(!sound||!ac)return;let duration=.7,buffer=ac.createBuffer(1,Math.ceil(ac.sampleRate*duration),ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);let source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();source.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(2800,ac.currentTime);filter.frequency.exponentialRampToValueAtTime(400,ac.currentTime+duration);gain.gain.setValueAtTime(.22,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+duration);source.connect(filter).connect(gain).connect(ac.destination);source.start();source.stop(ac.currentTime+duration)}
function chime(n,beats=1,level=1,when=ac.currentTime){if(!ac)return;let z=when,f=440*2**((n-69)/12);for(const [m,a,d] of [[1,.28,Math.max(1.2,beats*beatSeconds*.95)],[2,.07,.5],[3,.02,.25]]){let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f*m;v.gain.setValueAtTime(.0001,z);v.gain.exponentialRampToValueAtTime(a*level,z+.005);v.gain.exponentialRampToValueAtTime(.0001,z+d);o.connect(v).connect(master);track(o);o.start(z);o.stop(z+d+.01)}}
// A soft organ-like chord shares the bass impact timestamp and releases before the next chord.
function chordTone(chord,seconds,when){if(!ac)return;const duration=Math.max(.12,seconds*.88);for(const n of chord.notes){const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=440*2**((n-69)/12);v.gain.setValueAtTime(.0001,when);v.gain.exponentialRampToValueAtTime(.055,when+Math.min(.035,duration/4));v.gain.setValueAtTime(.042,when+duration*.65);v.gain.exponentialRampToValueAtTime(.0001,when+duration);o.connect(v).connect(master);track(o);o.start(when);o.stop(when+duration+.02)}}
function bassTone(n,beats,final=false,when=ac.currentTime){if(!ac)return;if(final)chime(n+36,beats,.16,when);let z=when,d=Math.max(1,beats*beatSeconds),f=440*2**((n-69)/12);for(let [multiple,level,type] of [[1,.20,'sine'],[2,.055,'triangle']]){let o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f*multiple;v.gain.setValueAtTime(.0001,z);v.gain.exponentialRampToValueAtTime(level,z+.018);v.gain.exponentialRampToValueAtTime(.0001,z+d);o.connect(v).connect(master);track(o);o.start(z);o.stop(z+d+.02)}}
function percussion(kind,when){if(!ac)return;const z=when;
 if(kind==='bell'){for(const f of [3200,4700,6100]){let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.setValueAtTime(.018,z);v.gain.exponentialRampToValueAtTime(.0001,z+.16);o.connect(v).connect(master);track(o);o.start(z);o.stop(z+.17)}return}
 let o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(kind==='tom'?150:190,z);o.frequency.exponentialRampToValueAtTime(kind==='tom'?48:100,z+.22);v.gain.setValueAtTime(kind==='tom'?.3:.10,z);v.gain.exponentialRampToValueAtTime(.0001,z+.32);o.connect(v).connect(master);track(o);o.start(z);o.stop(z+.34);
 if(kind==='snare'){let b=ac.createBuffer(1,Math.ceil(ac.sampleRate*.16),ac.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;let n=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();n.buffer=b;f.type='highpass';f.frequency.value=1500;v.gain.setValueAtTime(.11,z);v.gain.exponentialRampToValueAtTime(.0001,z+.16);n.connect(f).connect(v).connect(master);track(n);n.start(z);n.stop(z+.17)}
}

function reset(){drumStruck=0;audioDrumStruck=0;cameraY=0;stopVoices();audioStruck=0;audioBassStruck=0;clockLast=null;bassStruck=0;splashAge=-1;time=0;struck=0;finished=false;running=false;lanes.forEach(course=>course.forEach(p=>p.hit=-100));play.textContent='Release marbles';status.textContent=song.title+' · tap Release marbles'}
function frame(ms){let dt=last===null?0:Math.min(.04,(ms-last)/1000);last=ms;if(splashAge>=0)splashAge+=dt;if(running){let rate=Number(document.querySelector('#speed').value),now=ac?ac.currentTime:ms/1000,elapsed=clockLast===null?0:Math.max(0,now-clockLast);clockLast=now;time=Math.min(total,time+elapsed*rate);scheduleAudio(rate);while(struck<pads.length&&time>=arrivals[struck]){pads[struck].hit=arrivals[struck];harmony[struck].hit=arrivals[struck];status.textContent=pads[struck].name+' + '+harmony[struck].name+' · note '+(struck+1)+' of '+pads.length;struck++}while(bassStruck<bass.length&&time>=bassArrivals[bassStruck]){let p=bass[bassStruck],until=bassArrivals[bassStruck+1]||total;p.hit=bassArrivals[bassStruck];bassStruck++}while(drumStruck<drums.length&&time>=drumArrivals[drumStruck]){drums[drumStruck].hit=drumArrivals[drumStruck];drumStruck++}if(time>=total){running=false;finished=true;splashAge=0;splashSound();play.textContent='Play again';status.textContent='Splash! · '+song.title+' · finished'}}draw(dt);requestAnimationFrame(frame)}
play.onclick=async()=>{
 if(running){running=false;resyncAudio();play.textContent='Continue';status.textContent='Paused';return}
 if(finished)reset();
 try{
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(!ac||ac.state==='closed'){ac=new(window.AudioContext||window.webkitAudioContext)();master=null}
  if(!master){master=ac.createGain();master.gain.value=sound?1:0;master.connect(ac.destination)}

  const unlock=ac.createBufferSource();unlock.buffer=ac.createBuffer(1,1,ac.sampleRate);unlock.connect(master);unlock.start();

  running=false;play.textContent='Try sound again';
  status.textContent='Sound could not start. Tap Try sound again, or open this page in Safari.';
  return;
 }
 running=true;resyncAudio();scheduleAudio(Number(document.querySelector('#speed').value));
 play.textContent='Pause';status.textContent=sound?'Playing · '+song.title:'Playing · sound is muted; tap Sound on';
};document.querySelector('#reset').onclick=reset;document.querySelector('#mute').onclick=()=>{sound=!sound;if(master)master.gain.setTargetAtTime(sound?1:0,ac.currentTime,.01);document.querySelector('#mute').textContent=sound?'Mute':'Sound on';document.querySelector('#mute').setAttribute('aria-pressed',String(!sound))};document.querySelector('#chords').onclick=()=>{chordsEnabled=!chordsEnabled;const button=document.querySelector('#chords');button.textContent=chordsEnabled?'Chords on':'Chords off';button.setAttribute('aria-pressed',String(chordsEnabled));resyncAudio();if(running)scheduleAudio(Number(document.querySelector('#speed').value))};document.querySelector('#speed').oninput=()=>{if(running){resyncAudio();scheduleAudio(Number(document.querySelector('#speed').value))}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;resyncAudio();play.textContent='Continue';status.textContent='Paused · return and tap Continue'}});reset();requestAnimationFrame(frame);
})();
