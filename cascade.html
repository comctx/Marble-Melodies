<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rail Cascade · Marble Melodies</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171e22;color:#e8e5dc;font:15px system-ui}main{max-width:850px;margin:auto}header{padding:14px 18px 10px}a{color:#bfcacb;font-size:13px}h1{font:29px Georgia;margin:12px 0 6px}p{margin:4px 0;color:#aebbbc;line-height:1.5}canvas{display:block;width:100%;aspect-ratio:900/1000;background:#333f43}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px max(18px,env(safe-area-inset-bottom));background:#20292d}button{border:1px solid #627378;border-radius:24px;background:#37484b;color:white;font:15px system-ui;padding:11px 18px}#play{background:#d8b16d;color:#20292d;border-color:#d8b16d}label{font-size:13px;color:#c1ccca;display:flex;align-items:center;gap:7px}input{width:100px;accent-color:#d8b16d}#status{font-size:12px;color:#c2ceca;padding:0 18px 12px}@media(min-width:700px){canvas{max-height:76vh;width:auto;max-width:100%;margin:auto}}</style></head>
<body><main><header><a href="./index.html">← All Marble Melodies machines</a><h1>Rail Cascade</h1><p>One glass marble. A continuous downhill run with sweeping rail turns.</p></header><canvas width="900" height="1000" aria-label="Glass marble rolling down six sloping steel rail runs, turning smoothly around each end to descend to the next level"></canvas><div class="controls"><button id="play">Roll marble</button><button id="reset">Back to top</button><label>Speed <input id="speed" aria-label="Rolling speed" type="range" min="0.5" max="1.5" step="0.1" value="0.8"></label><button id="mute" aria-pressed="false">Sound on</button></div><div id="status" role="status">Ready at the top · tap Roll marble</div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play'),status=document.querySelector('#status');
const track=[];let length=0;
function add(x,y){let p=track[track.length-1];if(p)length+=Math.hypot(x-p.x,y-p.y);track.push({x,y,s:length})}
function straight(ax,ay,bx,by){for(let i=track.length?1:0;i<=140;i++){let u=i/140;add(ax+(bx-ax)*u,ay+(by-ay)*u)}}
function curve(ax,ay,bx,by,cx,cy,dx,dy){for(let i=1;i<=100;i++){let u=i/100,v=1-u;add(v*v*v*ax+3*v*v*u*bx+3*v*u*u*cx+u*u*u*dx,v*v*v*ay+3*v*v*u*by+3*v*u*u*cy+u*u*u*dy)}}
// Every segment descends. The hairpins share the straight rails' tangents.
straight(180,90,710,160);curve(710,160,840,177,840,233,710,250);
straight(710,250,190,320);curve(190,320,60,337,60,393,190,410);
straight(190,410,710,480);curve(710,480,840,497,840,553,710,570);
straight(710,570,190,640);curve(190,640,60,657,60,713,190,730);
straight(190,730,710,800);curve(710,800,840,817,840,873,710,890);
straight(710,890,390,933);
let distance=0,velocity=0,rolling=false,last=null,sound=false,ac=null;
const radius=17,marks=[650,1400,2150,2900,3650,4400];let nextMark=0;
function sample(s){s=Math.max(0,Math.min(length,s));let lo=0,hi=track.length-1;while(lo+1<hi){let m=(lo+hi)>>1;if(track[m].s<s)lo=m;else hi=m}let a=track[lo],b=track[hi],u=(s-a.s)/(b.s-a.s||1);return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,dx:b.x-a.x,dy:b.y-a.y}}
function stroke(points,offset,color,width){ctx.beginPath();points.forEach((p,i)=>{if(i)ctx.lineTo(p.x,p.y+offset);else ctx.moveTo(p.x,p.y+offset)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function disk(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function draw(){let bg=ctx.createLinearGradient(0,0,900,1000);bg.addColorStop(0,'#566365');bg.addColorStop(1,'#28383e');ctx.fillStyle=bg;ctx.fillRect(0,0,900,1000);
// Wall-mounted brackets and their shadows give the rails depth.
for(let s=80;s<length;s+=165){let p=sample(s);ctx.strokeStyle='#10212766';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(p.x+13,p.y+25);ctx.lineTo(p.x+30,p.y+53);ctx.stroke();ctx.strokeStyle='#819295';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,p.y+5);ctx.lineTo(p.x+12,p.y+34);ctx.lineTo(p.x+24,p.y+34);ctx.stroke();disk(p.x+24,p.y+34,6,'#a5b1af');disk(p.x+24,p.y+34,2,'#3a484a')}
stroke(track,24,'#15232a55',17);stroke(track,-5,'#17292f',7);stroke(track,-7,'#a9b9ba',5);stroke(track,-8,'#eff3ed',1.5);
for(let s=0;s<length;s+=35){let p=sample(s);ctx.strokeStyle='#809498';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y-4);ctx.lineTo(p.x,p.y+8);ctx.stroke()}
stroke(track,8,'#142831',8);stroke(track,6,'#a9bfc0',5);stroke(track,5,'#edf5ef',1.6);
// The center follows the same sampled curve as both rails: no jumping between levels.
let p=sample(distance),x=p.x,y=p.y-radius+1;ctx.save();ctx.shadowColor='#0a171c99';ctx.shadowBlur=10;ctx.shadowOffsetX=8;ctx.shadowOffsetY=12;let glass=ctx.createRadialGradient(x-6,y-8,1,x,y,radius);glass.addColorStop(0,'#e6ffff');glass.addColorStop(.22,'#74d4d2');glass.addColorStop(.6,'#2e9cae');glass.addColorStop(.88,'#164654');glass.addColorStop(1,'#b1dcce');disk(x,y,radius,glass);ctx.restore();ctx.save();ctx.beginPath();ctx.arc(x,y,radius-1,0,Math.PI*2);ctx.clip();ctx.translate(x,y);ctx.rotate(distance/radius);ctx.strokeStyle='#e6b756';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(0,0,7,19,.6,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#8bf4e2aa';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,12,19,-.6,0,Math.PI*2);ctx.stroke();ctx.restore();disk(x-6,y-8,4,'#ffffffcc');disk(x+6,y+8,2,'#baffef88');
ctx.fillStyle='#bdcdca';ctx.font='12px system-ui';ctx.fillText('START',146,53);ctx.fillText('FINISH',345,982);
// End stop remains visible; the marble rests here when the run ends.
let end=sample(length);ctx.fillStyle='#bba16d';ctx.fillRect(end.x-19,end.y-24,8,39);ctx.fillStyle='#6d5740';ctx.fillRect(end.x-19,end.y+15,40,6)}
function note(i){if(!sound||!ac)return;let now=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();o.frequency.value=[523.25,659.25,783.99,1046.5,783.99,659.25][i%6];v.gain.setValueAtTime(0,now);v.gain.linearRampToValueAtTime(.13,now+.006);v.gain.exponentialRampToValueAtTime(.0001,now+.7);o.connect(v).connect(ac.destination);o.start();o.stop(now+.75)}
function frame(ms){let dt=last===null?0:Math.min(.04,(ms-last)/1000);last=ms;if(rolling){let p=sample(distance),slope=p.dy/Math.hypot(p.dx,p.dy);velocity+= (600*slope-velocity*.10)*dt;velocity=Math.max(50,Math.min(velocity,240));distance=Math.min(length,distance+velocity*dt*Number(document.querySelector('#speed').value));while(nextMark<marks.length&&distance>=marks[nextMark])note(nextMark++);if(distance>=length){rolling=false;play.textContent='Roll again';status.textContent='Finished · the marble is resting at the bottom'}}draw();requestAnimationFrame(frame)}
play.onclick=()=>{if(distance>=length){distance=0;velocity=0;nextMark=0}rolling=!rolling;play.textContent=rolling?'Pause':'Continue';status.textContent=rolling?'Rolling downhill · following every rail turn':'Paused';if(ac)ac.resume()};
document.querySelector('#reset').onclick=()=>{distance=0;velocity=0;nextMark=0;rolling=false;play.textContent='Roll marble';status.textContent='Ready at the top · tap Roll marble'};
document.querySelector('#mute').onclick=async()=>{sound=!sound;if(sound){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){sound=false}}document.querySelector('#mute').textContent=sound?'Sound off':'Sound on';document.querySelector('#mute').setAttribute('aria-pressed',String(sound))};requestAnimationFrame(frame);
})();
</script></body></html>
