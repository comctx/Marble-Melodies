<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Note Cascade · Marble Melodies</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171e22;color:#e8e5dc;font:15px system-ui}main{max-width:850px;margin:auto}header{padding:14px 18px 10px}a{color:#bfcacb;font-size:13px}h1{font:29px Georgia;margin:12px 0 6px}p{margin:4px 0;color:#aebbbc;line-height:1.5}canvas{display:block;width:100%;aspect-ratio:900/1000;background:#333f43}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px max(18px,env(safe-area-inset-bottom));background:#20292d}button{border:1px solid #627378;border-radius:24px;background:#37484b;color:white;font:15px system-ui;padding:11px 18px}#play{background:#d8b16d;color:#20292d;border-color:#d8b16d}label{font-size:13px;color:#c1ccca;display:flex;align-items:center;gap:7px}input{width:100px;accent-color:#d8b16d}#status{font-size:12px;color:#c2ceca;padding:0 18px 12px}@media(min-width:700px){canvas{max-height:76vh;width:auto;max-width:100%;margin:auto}}</style></head>
<body><main><header><a href="./index.html">← All Marble Melodies machines</a><h1>Note Cascade</h1><p>Sweeping curves, twisting wire rails, and musical spring bouncers.</p></header><canvas width="900" height="1000" aria-label="Glass marble winding around curved wire rails and rebounding between eight irregularly spaced musical spring bouncers"></canvas><div class="controls"><button id="play">Release marble</button><button id="reset">Back to top</button><label>Speed <input id="speed" aria-label="Rolling speed" type="range" min="0.5" max="1.5" step="0.1" value="0.8"></label><button id="mute" aria-pressed="false">Mute</button></div><div id="status" role="status">Ready at the top · tap Drop marble</div></main>
<script>
(()=>{'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d'),play=document.querySelector('#play'),status=document.querySelector('#status');
const names=['Do','Re','Mi','Fa','Sol','La','Ti','Do'],notes=[60,62,64,65,67,69,71,72];
const pads=[[625,150,-.30],[240,270,.30],[610,390,-.35],[330,490,.35],[675,610,-.4],[200,725,.3],[565,835,-.25],[355,935,.15]].map(([x,y,angle],i)=>({x,y,angle,name:names[i],note:notes[i],hit:-100}));
const r=17;
// Each route starts and ends at a contact. The first part is an airborne rebound;
// the middle rides a curved guide rail, and the last part lands on the next bouncer.
const routes=[
 [[150,30],[140,80,315,28,430,65],[535,100,715,15,625,133]],
 [[625,133],[775,15,855,180,725,213],[590,248,390,125,240,253]],
 [[240,253],[90,120,65,370,225,352],[385,330,490,240,610,373]],
 [[610,373],[820,215,860,455,685,462],[560,470,470,340,330,473]],
 [[330,473],[150,335,100,535,300,555],[490,578,560,440,675,593]],
 [[675,593],[845,440,855,700,665,689],[480,680,385,560,200,708]],
 [[200,708],[50,560,65,865,230,824],[355,793,470,685,565,818]],
 [[565,818],[775,670,845,930,645,927],[520,925,470,805,355,918]],
 [[355,918],[220,825,180,945,330,970],[420,985,555,950,655,960]]
];
function build(route){let out=[],a=route[0],length=0;out.push({x:a[0],y:a[1],s:0});for(let j=1;j<route.length;j++){let v=route[j];for(let i=1;i<=160;i++){let u=i/160,w=1-u,x=w*w*w*a[0]+3*w*w*u*v[0]+3*w*u*u*v[2]+u*u*u*v[4],y=w*w*w*a[1]+3*w*w*u*v[1]+3*w*u*u*v[3]+u*u*u*v[5],p=out[out.length-1];length+=Math.hypot(x-p.x,y-p.y);out.push({x,y,s:length})}a=[v[4],v[5]]}return{points:out,length}}
const paths=routes.map(build),durations=paths.map((p,i)=>i===0?1.6:i===8?1.4:2.1),arrivals=[];let total=0;durations.forEach((d,i)=>{total+=d;if(i<8)arrivals.push(total)});
let time=0,last=null,running=false,finished=false,struck=0,sound=true,ac=null;
function sample(path,u){let s=path.length*Math.max(0,Math.min(1,u)),v=path.points,lo=0,hi=v.length-1;while(lo+1<hi){let m=(lo+hi)>>1;if(v[m].s<s)lo=m;else hi=m}let a=v[lo],b=v[hi],k=(s-a.s)/(b.s-a.s||1);return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}}
function position(t){let from=0;for(let i=0;i<paths.length;i++){if(t<=from+durations[i]||i===paths.length-1)return sample(paths[i],(t-from)/durations[i]);from+=durations[i]}return sample(paths[8],1)}
function line(ax,ay,bx,by,col,w=2){g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function disk(x,y,r,col){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=col;g.fill()}
function rail(path,offset,col,width){g.beginPath();for(let i=65;i<=275;i++){let p=path.points[i];if(i===65)g.moveTo(p.x,p.y+r+offset);else g.lineTo(p.x,p.y+r+offset)}g.strokeStyle=col;g.lineWidth=width;g.lineCap='round';g.stroke()}
function ellipse(x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill()}
function draw(){let bg=g.createLinearGradient(0,0,900,1000);bg.addColorStop(0,'#4d6065');bg.addColorStop(.5,'#293b43');bg.addColorStop(1,'#14262f');g.fillStyle=bg;g.fillRect(0,0,900,1000);
// Subtle frame posts behind the interwoven, free-standing wire tracks.
for(let x of [90,450,810]){line(x,25,x,978,'#0e212888',12);line(x-2,25,x-2,978,'#78878a22',2)}
for(let j=0;j<paths.length;j++){let path=paths[j];for(let i=90;i<270;i+=70){let p=path.points[i];line(p.x+12,p.y+37,p.x+30,p.y+60,'#09191f55',7);line(p.x,p.y+25,p.x+18,p.y+45,'#7f9398',3);disk(p.x+18,p.y+45,4,'#b0c0bd')}
rail(path,14,'#07182066',12);rail(path,-6,'#132b35',7);rail(path,-7,'#9fb7bd',4);rail(path,-8,'#e6f2ed',1);
for(let i=65;i<=275;i+=13){let p=path.points[i];line(p.x,p.y+r-4,p.x,p.y+r+7,'#8da5a9',1.6)}rail(path,7,'#122b36',7);rail(path,5,'#a8c4c6',4);rail(path,4,'#e5f3ed',1)}
for(let i=0;i<8;i++){let p=pads[i],age=time-p.hit,hit=age>=0&&age<.7?Math.sin(age*19)*Math.exp(-age*6):0;g.save();g.translate(p.x,p.y+8);g.rotate(p.angle);ellipse(12,29,60,15,'#0b1c2555');
// Exposed spring and round tilted bouncer replace the ladder-like flat steps.
line(-28,10,-28,30,'#82969a',4);line(28,10,28,30,'#82969a',4);g.beginPath();for(let k=0;k<=14;k++){let x=-25+k*50/14,y=25+(k%2?5:-5);if(k)g.lineTo(x,y);else g.moveTo(x,y)}g.strokeStyle='#d0c39c';g.lineWidth=2;g.stroke();ellipse(0,33,43,8,'#627980');g.translate(0,hit*8);ellipse(0,0,56,18,'#bd8956');ellipse(0,-5,56,18,'#f0c682');ellipse(0,-7,45,12,'#8f6045');ellipse(-3,-9,38,9,age>=0&&age<.3?'#ffe6ac':'#d4ac75');line(-36,-13,24,-13,'#fff0cb77',1);g.restore();
g.font='16px Georgia';g.fillStyle=age>=0&&age<.5?'#ffe6a5':'#d4dfd7';g.textAlign=i%2?'right':'left';g.fillText(p.name,p.x+(i%2?-76:76),p.y+7);
if(age>=0&&age<.45){g.strokeStyle='#f7ce7b';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y-r,23+age*55,Math.PI*1.1,Math.PI*1.9);g.stroke()}}
ellipse(655,984,65,12,'#1b3039');ellipse(655,980,65,11,'#8fa8ab');ellipse(655,976,53,7,'#334e58');
let p=position(time);g.save();g.shadowColor='#06131f88';g.shadowBlur=10;g.shadowOffsetX=8;g.shadowOffsetY=13;let glass=g.createRadialGradient(p.x-6,p.y-8,1,p.x,p.y,r);glass.addColorStop(0,'#f2ffff');glass.addColorStop(.25,'#75e3dc');glass.addColorStop(.7,'#24869d');glass.addColorStop(1,'#b5e1da');disk(p.x,p.y,r,glass);g.restore();g.save();g.beginPath();g.arc(p.x,p.y,r-1,0,Math.PI*2);g.clip();g.translate(p.x,p.y);g.rotate(time*5);g.strokeStyle='#eac369';g.lineWidth=6;g.beginPath();g.ellipse(0,0,8,19,.7,0,Math.PI*2);g.stroke();g.restore();disk(p.x-6,p.y-8,4,'#ffffffdd');g.textAlign='left'}
function chime(n){if(!sound||!ac)return;let z=ac.currentTime,f=440*2**((n-69)/12);for(const [m,a,d] of [[1,.28,1.2],[2,.07,.4],[3,.02,.2]]){let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f*m;v.gain.setValueAtTime(.0001,z);v.gain.exponentialRampToValueAtTime(a,z+.005);v.gain.exponentialRampToValueAtTime(.0001,z+d);o.connect(v).connect(ac.destination);o.start(z);o.stop(z+d+.01)}}
function reset(){time=0;struck=0;finished=false;running=false;pads.forEach(p=>p.hit=-100);play.textContent='Release marble';status.textContent='Ready · sweeping turns, curved rails, and eight musical rebounds'}
function frame(ms){let dt=last===null?0:Math.min(.04,(ms-last)/1000);last=ms;if(running){time=Math.min(total,time+dt*Number(document.querySelector('#speed').value));while(struck<8&&time>=arrivals[struck]){pads[struck].hit=arrivals[struck];chime(pads[struck].note);status.textContent=pads[struck].name+' · bounce '+(struck+1)+' of 8';struck++}if(time>=total){running=false;finished=true;play.textContent='Release again';status.textContent='Finished · eight bouncers, one winding journey'}}draw();requestAnimationFrame(frame)}
play.onclick=async()=>{if(finished)reset();try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){}running=!running;play.textContent=running?'Pause':'Continue';if(!running)status.textContent='Paused'};document.querySelector('#reset').onclick=reset;document.querySelector('#mute').onclick=()=>{sound=!sound;document.querySelector('#mute').textContent=sound?'Mute':'Sound on';document.querySelector('#mute').setAttribute('aria-pressed',String(!sound))};reset();requestAnimationFrame(frame);
})();

</script></body></html>
