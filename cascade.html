<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Note Cascade · Marble Melodies</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171e22;color:#e8e5dc;font:15px system-ui}main{max-width:850px;margin:auto}header{padding:14px 18px 10px}a{color:#bfcacb;font-size:13px}h1{font:29px Georgia;margin:12px 0 6px}p{margin:4px 0;color:#aebbbc;line-height:1.5}canvas{display:block;width:100%;aspect-ratio:900/1000;background:#333f43}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px max(18px,env(safe-area-inset-bottom));background:#20292d}button{border:1px solid #627378;border-radius:24px;background:#37484b;color:white;font:15px system-ui;padding:11px 18px}#play{background:#d8b16d;color:#20292d;border-color:#d8b16d}label{font-size:13px;color:#c1ccca;display:flex;align-items:center;gap:7px}input{width:100px;accent-color:#d8b16d}#status{font-size:12px;color:#c2ceca;padding:0 18px 12px}@media(min-width:700px){canvas{max-height:76vh;width:auto;max-width:100%;margin:auto}}</style></head>
<body><main><header><a href="./index.html">← All Marble Melodies machines</a><h1>Note Cascade</h1><p>The Star-Spangled Banner · three marbles—melody, harmony, and warm chords with deep bass. Spinning pads and seesaw launches bring the cascade to life.</p></header><canvas width="900" height="1000" aria-label="Three distinct marbles bounce down separate melody, harmony and bass courses; the larger golden bass marble plays slower notes and all three finish together"></canvas><div class="controls"><button id="play">Release marbles</button><button id="reset">Back to top</button><label>Tempo <input id="speed" aria-label="Anthem tempo" type="range" min="0.5" max="1.5" step="0.1" value="1"></label><button id="chords" aria-pressed="true">Chords on</button><button id="mute" aria-pressed="false">Mute</button></div><div id="status" role="status">The Star-Spangled Banner · ready</div></main>
<script>
(()=>{'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d'),play=document.querySelector('#play'),status=document.querySelector('#status');
// The Star-Spangled Banner: traditional melody, original synthesized performance.
const melody=[[69,0.75],[66,0.25],[62,1],[66,1],[69,1],[74,2],[78,0.75],[76,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.5],[73,0.5],[74,1],[74,1],[69,1],[66,1],[62,2],[69,0.75],[66,0.25],[62,1],[66,1],[69,1],[74,2],[78,0.75],[76,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.5],[73,0.5],[74,1],[74,1],[69,1],[66,1],[62,2],[78,0.75],[78,0.25],[78,1],[79,1],[81,1],[81,2],[79,0.75],[78,0.25],[76,1],[78,1],[79,1],[79,2],[79,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.75],[73,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[74,1],[74,1],[74,0.5],[73,0.5],[71,1],[71,1],[71,1],[76,1],[79,0.5],[78,0.5],[76,0.5],[74,0.5],[74,1],[73,1],[69,0.75],[69,0.25],[74,1.5],[76,0.5],[78,0.5],[79,0.5],[81,2],[74,0.75],[76,0.25],[78,1.5],[79,0.5],[76,1],[74,3]];
const pitchNames=['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'];
const layout=[620,305,715,475,190,605,320,650];
const pads=melody.map(([note,beats],i)=>({x:layout[i%8]+Math.sin(i*.9)*18,y:150+i*105,angle:[-.42,.34,-.48,-.24,.46,-.38,.42,-.32][i%8],name:pitchNames[note%12]+(Math.floor(note/12)-1),note,beats,hit:-100}));
// Chord tones follow the anthem in D; G-sharp leads through E7 to A.
const chordBook={D:{name:'D',root:38,notes:[50,57,66]},A7:{name:'A7',root:33,notes:[49,55,64]},G:{name:'G',root:31,notes:[50,55,59]},Bm:{name:'Bm',root:35,notes:[50,54,59]},E7:{name:'E7',root:40,notes:[52,56,62]}};
const chordKeys=pads.map((p,i)=>{
  if(i===pads.length-1)return 'D';
  const pc=p.note%12;
  if(pc===8)return 'E7';
  if(pc===1||pc===4)return 'A7';
  if(pc===7||pc===11)return 'G';
  return 'D';
});
const harmony=pads.map((p,i)=>{const chord=chordBook[chordKeys[i]];let note=p.note-1;while(!chord.notes.some(n=>n%12===note%12))note--;return{...p,note,name:pitchNames[note%12]+(Math.floor(note/12)-1),angle:-p.angle,hit:-100}});
// Alternate occasional seesaws with spinning discs; both activate only on impact.
const lanes=[pads,harmony];
const laneX=(x,lane)=>lane===2?450+(x-450)*.09:lane?900-(x*.40+10):x*.40+10;
const r=17,endY=pads[pads.length-1].y+120;
const anchors=[{x:425,y:28},...pads.map(p=>({x:p.x,y:p.y+2-r})),{x:465,y:endY}];
const beatSeconds=60/84;
const durations=[.8,...melody.slice(0,-1).map(n=>n[1]*beatSeconds),melody[melody.length-1][1]*beatSeconds+.6];
const heights=durations.map((d,i)=>i===0?0:Math.min(125,12+110*d*d));
const arrivals=[];let total=0;durations.forEach((d,i)=>{total+=d;if(i<pads.length)arrivals.push(total)});
// Bass bounces span several melody notes, with one shared final strike.
const bassIndices=[0];let heldBeats=0;
for(let i=1;i<pads.length-1;i++){heldBeats+=melody[i-1][1];if(heldBeats>=2.5||i-bassIndices[bassIndices.length-1]>=3){bassIndices.push(i);heldBeats=0}}
if(bassIndices[bassIndices.length-1]!==pads.length-1)bassIndices.push(pads.length-1);
// Land on harmonic changes as well as the slower bass pulse.
for(let i=1;i<pads.length;i++)if(chordKeys[i]!==chordKeys[i-1]&&!bassIndices.includes(i))bassIndices.push(i);
bassIndices.sort((a,b)=>a-b);
const bass=bassIndices.map((i,j)=>{const p=pads[i],chord=chordBook[chordKeys[i]],root=chord.root;return{...p,note:root,chord,name:chord.name,angle:Math.sin(j*1.7)*.32,hit:-100}});
lanes.push(bass);
lanes.forEach((course,lane)=>course.forEach((p,i)=>{p.mechanism=(i+lane*3)%8===3?'seesaw':'spinner';const next=course[i+1];p.launch=next?Math.sign(laneX(next.x,lane)-laneX(p.x,lane))||1:1}));
function padMotion(p,t){const age=t-p.hit;if(age<0||age>1.2)return{tilt:0,spin:0};const u=Math.min(1,age/.9),ease=1-(1-u)**3;return{tilt:p.mechanism==='seesaw'?p.launch*.42*Math.sin(Math.PI*Math.min(1,age/.65))*Math.exp(-age*1.5):0,spin:p.mechanism==='spinner'?Math.PI*2*ease:0}}
// Sideways sweep follows a seesaw launch but vanishes at both note contacts.
function launchSweep(course,i,u,lane){if(i===0||!course[i-1]||course[i-1].mechanism!=='seesaw')return 0;return course[i-1].launch*(lane===2?35:42)*Math.sin(Math.PI*u)**2}

const bassArrivals=bassIndices.map(i=>arrivals[i]);
function bassPosition(t){let times=[0,...bassArrivals,total],points=[{x:425,y:21},...bass.map(p=>({x:p.x,y:p.y+2-24})),{x:465,y:endY-7}];for(let i=0;i<times.length-1;i++){if(t<=times[i+1]||i===times.length-2){let u=Math.max(0,Math.min(1,(t-times[i])/(times[i+1]-times[i]))),a=points[i],b=points[i+1],height=i===0?0:Math.min(145,20+28*(times[i+1]-times[i])**2);return{x:a.x+(b.x-a.x)*u+launchSweep(bass,i,u,2)/.09,y:a.y+(b.y-a.y)*u-height*4*u*(1-u)}}}}
let bassStruck=0,audioStruck=0,audioBassStruck=0,clockLast=null,master=null,chordsEnabled=true;
const voices=new Set();
function stopVoices(){for(const o of voices){try{o.stop()}catch(e){}}voices.clear()}
function track(o){voices.add(o);o.onended=()=>voices.delete(o)}
function scheduleAudio(rate){if(!ac)return;const horizon=time+.12*rate;while(audioStruck<pads.length&&arrivals[audioStruck]<=horizon){let i=audioStruck++,when=ac.currentTime+Math.max(0,(arrivals[i]-time)/rate);chime(pads[i].note,pads[i].beats/rate,.82,when);chime(harmony[i].note,harmony[i].beats/rate,.34,when)}while(audioBassStruck<bass.length&&bassArrivals[audioBassStruck]<=horizon){let i=audioBassStruck++,until=bassArrivals[i+1]||total; if(chordsEnabled)chordTone(bass[i].chord,(until-bassArrivals[i])/rate,ac.currentTime+Math.max(0,(bassArrivals[i]-time)/rate)); bassTone(bass[i].note,(until-bassArrivals[i])/beatSeconds/rate,i===bass.length-1,ac.currentTime+Math.max(0,(bassArrivals[i]-time)/rate))}}
function resyncAudio(){stopVoices();audioStruck=struck;audioBassStruck=bassStruck;clockLast=ac?ac.currentTime:null}
let cameraY=0;
let time=0,last=null,running=false,finished=false,struck=0,sound=true,ac=null,splashAge=-1;
function position(t,lane=0){let from=0;for(let i=0;i<durations.length;i++){if(t<=from+durations[i]||i===durations.length-1){let u=Math.max(0,Math.min(1,(t-from)/durations[i])),a=anchors[i],b=anchors[i+1];return{x:a.x+(b.x-a.x)*u+launchSweep(lanes[lane],i,u,lane)/(lane===1?-.40:.40),y:a.y+(b.y-a.y)*u-heights[i]*4*u*(1-u)}}from+=durations[i]}}
function line(ax,ay,bx,by,col,w=2){g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function disk(x,y,r,col){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=col;g.fill()}
function ellipse(x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill()}
function draw(dt=1/60){let bg=g.createLinearGradient(0,0,900,1000);bg.addColorStop(0,'#4d6065');bg.addColorStop(.5,'#293b43');bg.addColorStop(1,'#14262f');g.fillStyle=bg;g.fillRect(0,0,900,1000);
let ball=position(time),target=Math.max(cameraY,Math.min(endY-820,ball.y-390));cameraY+=(target-cameraY)*(1-Math.exp(-dt*7));let camera=cameraY;g.save();g.translate(0,-camera);
for(let lane=0;lane<3;lane++){let course=lanes[lane];for(let i=0;i<course.length;i++){let p=course[i];if(p.y<camera-100||p.y>camera+1100)continue;let px=laneX(p.x,lane),motion=padMotion(p,time);let age=time-p.hit,hit=age>=0&&age<.7?Math.sin(age*19)*Math.exp(-age*6):0;g.save();g.translate(px,p.y+8);g.rotate(p.angle+motion.tilt);g.scale(.78,.85);ellipse(12,29,60,15,'#0b1c2555');
// Visible fulcrum and balanced beam distinguish the occasional seesaw.
if(p.mechanism==='seesaw'){g.beginPath();g.moveTo(-14,43);g.lineTo(0,11);g.lineTo(14,43);g.closePath();g.fillStyle='#83989b';g.fill();line(-76,7,76,7,'#e4bc77',10);disk(-72,7,7,'#a87343');disk(72,7,7,'#a87343');disk(0,16,6,'#f3d79d')}
// Exposed spring and round tilted bouncer.
line(-28,10,-28,30,'#82969a',4);line(28,10,28,30,'#82969a',4);g.beginPath();for(let k=0;k<=14;k++){let x=-25+k*50/14,y=25+(k%2?5:-5);if(k)g.lineTo(x,y);else g.moveTo(x,y)}g.strokeStyle='#d0c39c';g.lineWidth=2;g.stroke();ellipse(0,33,43,8,'#627980');g.translate(0,hit*8);ellipse(0,0,56,18,'#bd8956');ellipse(0,-5,56,18,'#f0c682');ellipse(0,-7,45,12,lane===2?'#796029':lane?'#435c89':'#8f6045');ellipse(-3,-9,38,9,age>=0&&age<.3?'#ffe6ac':lane===2?'#dfc567':lane?'#9ebee0':'#d4ac75');line(-36,-13,24,-13,'#fff0cb77',1);
if(p.mechanism==='spinner'){for(let spoke=0;spoke<5;spoke++){const a=motion.spin+spoke*Math.PI*2/5;line(Math.cos(a)*9,-7+Math.sin(a)*2,Math.cos(a)*37,-7+Math.sin(a)*10,'#fff1c4aa',2)}disk(0,-7,4,'#fff0c2')}
else{g.fillStyle='#fff3cb';g.font='10px system-ui';g.textAlign='center';g.fillText('↔',0,-3)}g.restore();
g.font='16px Georgia';g.fillStyle=age>=0&&age<.5?'#ffe6a5':'#d4dfd7';g.textAlign=lane===2?'center':lane?'left':'right';g.fillText(p.name,Math.max(44,Math.min(856,px+(lane===2?0:lane?61:-61))),p.y+(lane===2?53:7));
if(age>=0&&age<.45){g.strokeStyle='#f7ce7b';g.lineWidth=2;g.beginPath();g.arc(px,p.y-r,23+age*55,Math.PI*1.1,Math.PI*1.9);g.stroke()}}}
for(let lane=0;lane<3;lane++){let bowlX=laneX(465,lane);ellipse(bowlX,endY+24,65,12,'#1b3039');ellipse(bowlX,endY+20,65,11,'#8fa8ab');ellipse(bowlX,endY+16,53,7,'#438b9a');ellipse(bowlX-9,endY+14,32,3,'#a9e9e477');
let base=lane===2?bassPosition(time):position(time,lane),p={x:laneX(base.x,lane),y:base.y},radius=lane===2?24:r;g.save();g.shadowColor='#06131f88';g.shadowBlur=10;g.shadowOffsetX=8;g.shadowOffsetY=13;let glass=g.createRadialGradient(p.x-6,p.y-8,1,p.x,p.y,radius);glass.addColorStop(0,'#f2ffff');glass.addColorStop(.25,lane===2?'#ffe093':lane?'#ffbe8e':'#75e3dc');glass.addColorStop(.7,lane===2?'#a77b26':lane?'#b95259':'#24869d');glass.addColorStop(1,'#b5e1da');disk(p.x,p.y,radius,glass);g.restore();g.save();g.beginPath();g.arc(p.x,p.y,radius-1,0,Math.PI*2);g.clip();g.translate(p.x,p.y);g.rotate(time*5);g.strokeStyle=lane===2?'#fff4cf':lane?'#ffe7bb':'#eac369';g.lineWidth=6;g.beginPath();g.ellipse(0,0,lane===2?12:8,lane===2?27:19,.7,0,Math.PI*2);g.stroke();g.restore();disk(p.x-6,p.y-8,4,'#ffffffdd');g.textAlign='left';drawSplash(laneX(465,lane));}g.restore();g.fillStyle='#dce7df';g.font='14px system-ui';g.textAlign='center';g.fillText('MELODY',180,24);g.fillText(chordsEnabled?'CHORDS + BASS':'BASS · gold marble',450,24);g.fillText('HARMONY',720,24);g.textAlign='left'}
// Real-time splash animation continues after the music and marble stop.
function drawSplash(cx){if(splashAge<0||splashAge>2.8)return;let t=splashAge,cy=endY+16,fade=Math.max(0,1-t/2.8);g.save();
for(let i=0;i<4;i++){let age=t-i*.11;if(age<0)continue;g.globalAlpha=Math.max(0,1-age/1.8)*.7;g.beginPath();g.ellipse(cx,cy+3,35+age*105,7+age*16,0,0,Math.PI*2);g.strokeStyle=i%2?'#efffff':'#6ddff0';g.lineWidth=3;g.stroke()}
// Wide translucent crown erupts around the landing marble.
if(t<1.1){let u=t/1.1,h=Math.sin(Math.PI*Math.sqrt(u))*150,w=28+u*110;g.globalAlpha=(1-u)*.8;g.beginPath();g.moveTo(cx-47,cy);g.quadraticCurveTo(cx-w,cy-h*.45,cx-w*.85,cy-h);g.quadraticCurveTo(cx-25,cy-h*.6,cx,cy-8);g.quadraticCurveTo(cx+25,cy-h*.6,cx+w*.85,cy-h);g.quadraticCurveTo(cx+w,cy-h*.45,cx+47,cy);g.closePath();g.fillStyle='#85e9f1';g.fill();g.strokeStyle='#d9ffff';g.lineWidth=2;g.stroke()}
for(let i=0;i<86;i++){let seed=Math.sin(i*127.1+19)*43758.5453,rand=seed-Math.floor(seed),angle=-Math.PI*.94+(i%23)/22*Math.PI*.88,speed=135+rand*255,delay=(i%5)*.018,age=t-delay;if(age<0)continue;let x=cx+Math.cos(angle)*speed*age,y=cy+Math.sin(angle)*speed*age+220*age*age;if(y>cy+12&&age>.3)continue;g.globalAlpha=fade*Math.min(1,age*18);g.save();g.translate(x,y);g.rotate(Math.atan2(Math.sin(angle)*speed+440*age,Math.cos(angle)*speed));ellipse(0,0,3+rand*4,2+rand*2,i%3?'#8ae9f0':'#efffff');g.restore()}
g.restore()}
function splashSound(){if(!sound||!ac)return;let duration=.7,buffer=ac.createBuffer(1,Math.ceil(ac.sampleRate*duration),ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);let source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();source.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(2800,ac.currentTime);filter.frequency.exponentialRampToValueAtTime(400,ac.currentTime+duration);gain.gain.setValueAtTime(.22,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+duration);source.connect(filter).connect(gain).connect(ac.destination);source.start();source.stop(ac.currentTime+duration)}
function chime(n,beats=1,level=1,when=ac.currentTime){if(!ac)return;let z=when,f=440*2**((n-69)/12);for(const [m,a,d] of [[1,.28,Math.max(1.2,beats*beatSeconds*.95)],[2,.07,.5],[3,.02,.25]]){let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f*m;v.gain.setValueAtTime(.0001,z);v.gain.exponentialRampToValueAtTime(a*level,z+.005);v.gain.exponentialRampToValueAtTime(.0001,z+d);o.connect(v).connect(master);track(o);o.start(z);o.stop(z+d+.01)}}
// A soft organ-like chord shares the bass impact timestamp and releases before the next chord.
function chordTone(chord,seconds,when){if(!ac)return;const duration=Math.max(.12,seconds*.88);for(const n of chord.notes){const o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.value=440*2**((n-69)/12);v.gain.setValueAtTime(.0001,when);v.gain.exponentialRampToValueAtTime(.055,when+Math.min(.035,duration/4));v.gain.setValueAtTime(.042,when+duration*.65);v.gain.exponentialRampToValueAtTime(.0001,when+duration);o.connect(v).connect(master);track(o);o.start(when);o.stop(when+duration+.02)}}
function bassTone(n,beats,final=false,when=ac.currentTime){if(!ac)return;if(final)chime(69,beats,.16,when);let z=when,d=Math.max(1,beats*beatSeconds),f=440*2**((n-69)/12);for(let [multiple,level,type] of [[1,.20,'sine'],[2,.055,'triangle']]){let o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f*multiple;v.gain.setValueAtTime(.0001,z);v.gain.exponentialRampToValueAtTime(level,z+.018);v.gain.exponentialRampToValueAtTime(.0001,z+d);o.connect(v).connect(master);track(o);o.start(z);o.stop(z+d+.02)}}
function reset(){cameraY=0;stopVoices();audioStruck=0;audioBassStruck=0;clockLast=null;bassStruck=0;splashAge=-1;time=0;struck=0;finished=false;running=false;lanes.forEach(course=>course.forEach(p=>p.hit=-100));play.textContent='Release marbles';status.textContent='The Star-Spangled Banner · tap Release marbles'}
function frame(ms){let dt=last===null?0:Math.min(.04,(ms-last)/1000);last=ms;if(splashAge>=0)splashAge+=dt;if(running){let rate=Number(document.querySelector('#speed').value),now=ac?ac.currentTime:ms/1000,elapsed=clockLast===null?0:Math.max(0,now-clockLast);clockLast=now;time=Math.min(total,time+elapsed*rate);scheduleAudio(rate);while(struck<pads.length&&time>=arrivals[struck]){pads[struck].hit=arrivals[struck];harmony[struck].hit=arrivals[struck];status.textContent=pads[struck].name+' + '+harmony[struck].name+' · trio '+(struck+1)+' of '+pads.length;struck++}while(bassStruck<bass.length&&time>=bassArrivals[bassStruck]){let p=bass[bassStruck],until=bassArrivals[bassStruck+1]||total;p.hit=bassArrivals[bassStruck];bassStruck++}if(time>=total){running=false;finished=true;splashAge=0;splashSound();play.textContent='Play trio again';status.textContent='Splash! · The Star-Spangled Banner · finished'}}draw(dt);requestAnimationFrame(frame)}
play.onclick=async()=>{if(finished)reset();try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(!master){master=ac.createGain();master.gain.value=sound?1:0;master.connect(ac.destination)}await ac.resume()}catch(e){}running=!running;resyncAudio();if(running)scheduleAudio(Number(document.querySelector('#speed').value));play.textContent=running?'Pause':'Continue';if(!running)status.textContent='Paused'};document.querySelector('#reset').onclick=reset;document.querySelector('#mute').onclick=()=>{sound=!sound;if(master)master.gain.setTargetAtTime(sound?1:0,ac.currentTime,.01);document.querySelector('#mute').textContent=sound?'Mute':'Sound on';document.querySelector('#mute').setAttribute('aria-pressed',String(!sound))};document.querySelector('#chords').onclick=()=>{chordsEnabled=!chordsEnabled;const button=document.querySelector('#chords');button.textContent=chordsEnabled?'Chords on':'Chords off';button.setAttribute('aria-pressed',String(chordsEnabled));resyncAudio();if(running)scheduleAudio(Number(document.querySelector('#speed').value))};document.querySelector('#speed').oninput=()=>{if(running){resyncAudio();scheduleAudio(Number(document.querySelector('#speed').value))}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;resyncAudio();play.textContent='Continue';status.textContent='Paused · return and tap Continue'}});reset();requestAnimationFrame(frame);
})();

</script></body></html>
