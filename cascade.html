  const clock=solo?soloAge:time;

  if(!head||head.y<camera-220||head.y>camera+1200)continue;

function advanceSolo(dt){

  const chord=chordBook[chordKeys[chordKeys.length-1]];

function cymbalAccent(when,final=false){if(!ac)return;const duration=final?1.05:.42,buffer=ac.createBuffer(1,Math.ceil(ac.sampleRate*duration),ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*(final?.24:.09)));const source=ac.createBufferSource(),filter=ac.createBiquadFilter(),v=ac.createGain();source.buffer=buffer;filter.type='highpass';filter.frequency.value=3800;v.gain.setValueAtTime(final?.075:.045,when);v.gain.exponentialRampToValueAtTime(.0001,when+duration);source.connect(filter).connect(v).connect(master);track(source);source.start(when);source.stop(when+duration)}

function splashSound(){if(!sound||!ac)return;let duration=.7,buffer=ac.createBuffer(1,Math.ceil(ac.sampleRate*duration),ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);let source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();source.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(2800,ac.currentTime);filter.frequency.exponentialRampToValueAtTime(400,ac.currentTime+duration);gain.gain.setValueAtTime(.22,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+duration);source.connect(filter).connect(gain).connect(ac.destination);source.start();source.stop(ac.currentTime+duration)}

function reset(){soloAge=-1;soloNext=1;nextMechanismCue=0;drumStruck=0;audioDrumStruck=0;cameraY=0;stopVoices();audioStruck=0;audioBassStruck=0;clockLast=null;bassStruck=0;splashAge=-1;stringSplashAge=-1;time=0;struck=0;finished=false;running=false;lanes.forEach(course=>course.forEach(p=>p.hit=-100));play.textContent='Release marbles';status.textContent=song.title+' · tap Release marbles'}
