<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Note Cascade · Marble Melodies</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171e22;color:#e8e5dc;font:15px system-ui}main{max-width:850px;margin:auto}header{padding:14px 18px 10px}a{color:#bfcacb;font-size:13px}h1{font:29px Georgia;margin:12px 0 6px}p{margin:4px 0;color:#aebbbc;line-height:1.5}canvas{display:block;width:100%;aspect-ratio:900/1000;background:#333f43}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px max(18px,env(safe-area-inset-bottom));background:#20292d}button{border:1px solid #627378;border-radius:24px;background:#37484b;color:white;font:15px system-ui;padding:11px 18px}#play{background:#d8b16d;color:#20292d;border-color:#d8b16d}label{font-size:13px;color:#c1ccca;display:flex;align-items:center;gap:7px}input{width:100px;accent-color:#d8b16d}#status{font-size:12px;color:#c2ceca;padding:0 18px 12px}@media(min-width:700px){canvas{max-height:76vh;width:auto;max-width:100%;margin:auto}}</style></head>
<body><main><header><a href="./index.html">← All Marble Melodies machines</a><h1>Note Cascade</h1><p>The Star-Spangled Banner · one marble, one note at every bounce.</p></header><canvas width="900" height="1000" aria-label="One marble bouncing freely between tilted musical bouncers arranged in an irregular winding course, with no rails"></canvas><div class="controls"><button id="play">Release marble</button><button id="reset">Back to top</button><label>Tempo <input id="speed" aria-label="Anthem tempo" type="range" min="0.5" max="1.5" step="0.1" value="1"></label><button id="mute" aria-pressed="false">Mute</button></div><div id="status" role="status">The Star-Spangled Banner · ready</div></main>
<script>
(()=>{'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d'),play=document.querySelector('#play'),status=document.querySelector('#status');
// The Star-Spangled Banner: traditional melody, original synthesized performance.
const melody=[[69,0.75],[66,0.25],[62,1],[66,1],[69,1],[74,2],[78,0.75],[76,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.5],[73,0.5],[74,1],[74,1],[69,1],[66,1],[62,2],[69,0.75],[66,0.25],[62,1],[66,1],[69,1],[74,2],[78,0.75],[76,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.5],[73,0.5],[74,1],[74,1],[69,1],[66,1],[62,2],[78,0.75],[78,0.25],[78,1],[79,1],[81,1],[81,2],[79,0.75],[78,0.25],[76,1],[78,1],[79,1],[79,2],[79,1],[78,1.5],[76,0.5],[74,1],[73,2],[71,0.75],[73,0.25],[74,1],[66,1],[68,1],[69,2],[69,1],[74,1],[74,1],[74,0.5],[73,0.5],[71,1],[71,1],[71,1],[76,1],[79,0.5],[78,0.5],[76,0.5],[74,0.5],[74,1],[73,1],[69,0.75],[69,0.25],[74,1.5],[76,0.5],[78,0.5],[79,0.5],[81,2],[74,0.75],[76,0.25],[78,1.5],[79,0.5],[76,1],[74,3]];
const pitchNames=['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'];
const layout=[620,305,715,475,190,605,320,650];
const pads=melody.map(([note,beats],i)=>({x:layout[i%8]+Math.sin(i*.9)*18,y:150+i*105,angle:[-.42,.34,-.48,-.24,.46,-.38,.42,-.32][i%8],name:pitchNames[note%12]+(Math.floor(note/12)-1),note,beats,hit:-100}));
const r=17,endY=pads[pads.length-1].y+120;
const anchors=[{x:425,y:28},...pads.map(p=>({x:p.x,y:p.y-r})),{x:465,y:endY}];
const beatSeconds=60/84;
const durations=[.8,...melody.slice(0,-1).map(n=>n[1]*beatSeconds),melody[melody.length-1][1]*beatSeconds+.6];
const heights=durations.map((d,i)=>i===0?0:Math.min(125,35+d*65));
const arrivals=[];let total=0;durations.forEach((d,i)=>{total+=d;if(i<pads.length)arrivals.push(total)});
let time=0,last=null,running=false,finished=false,struck=0,sound=true,ac=null;
function position(t){let from=0;for(let i=0;i<durations.length;i++){if(t<=from+durations[i]||i===durations.length-1){let u=Math.max(0,Math.min(1,(t-from)/durations[i])),a=anchors[i],b=anchors[i+1];return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u-heights[i]*4*u*(1-u)}}from+=durations[i]}}
function line(ax,ay,bx,by,col,w=2){g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function disk(x,y,r,col){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=col;g.fill()}
function ellipse(x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill()}
function draw(){let bg=g.createLinearGradient(0,0,900,1000);bg.addColorStop(0,'#4d6065');bg.addColorStop(.5,'#293b43');bg.addColorStop(1,'#14262f');g.fillStyle=bg;g.fillRect(0,0,900,1000);
let ball=position(time),camera=Math.max(0,Math.min(endY-820,ball.y-390));g.save();g.translate(0,-camera);
for(let i=0;i<pads.length;i++){let p=pads[i];if(p.y<camera-100||p.y>camera+1100)continue;let age=time-p.hit,hit=age>=0&&age<.7?Math.sin(age*19)*Math.exp(-age*6):0;g.save();g.translate(p.x,p.y+8);g.rotate(p.angle);ellipse(12,29,60,15,'#0b1c2555');
// Exposed spring and round tilted bouncer replace the ladder-like flat steps.
line(-28,10,-28,30,'#82969a',4);line(28,10,28,30,'#82969a',4);g.beginPath();for(let k=0;k<=14;k++){let x=-25+k*50/14,y=25+(k%2?5:-5);if(k)g.lineTo(x,y);else g.moveTo(x,y)}g.strokeStyle='#d0c39c';g.lineWidth=2;g.stroke();ellipse(0,33,43,8,'#627980');g.translate(0,hit*8);ellipse(0,0,56,18,'#bd8956');ellipse(0,-5,56,18,'#f0c682');ellipse(0,-7,45,12,'#8f6045');ellipse(-3,-9,38,9,age>=0&&age<.3?'#ffe6ac':'#d4ac75');line(-36,-13,24,-13,'#fff0cb77',1);g.restore();
g.font='16px Georgia';g.fillStyle=age>=0&&age<.5?'#ffe6a5':'#d4dfd7';g.textAlign=i%2?'right':'left';g.fillText(p.name,p.x+(i%2?-76:76),p.y+7);
if(age>=0&&age<.45){g.strokeStyle='#f7ce7b';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y-r,23+age*55,Math.PI*1.1,Math.PI*1.9);g.stroke()}}
ellipse(465,endY+24,65,12,'#1b3039');ellipse(465,endY+20,65,11,'#8fa8ab');ellipse(465,endY+16,53,7,'#334e58');
let p=position(time);g.save();g.shadowColor='#06131f88';g.shadowBlur=10;g.shadowOffsetX=8;g.shadowOffsetY=13;let glass=g.createRadialGradient(p.x-6,p.y-8,1,p.x,p.y,r);glass.addColorStop(0,'#f2ffff');glass.addColorStop(.25,'#75e3dc');glass.addColorStop(.7,'#24869d');glass.addColorStop(1,'#b5e1da');disk(p.x,p.y,r,glass);g.restore();g.save();g.beginPath();g.arc(p.x,p.y,r-1,0,Math.PI*2);g.clip();g.translate(p.x,p.y);g.rotate(time*5);g.strokeStyle='#eac369';g.lineWidth=6;g.beginPath();g.ellipse(0,0,8,19,.7,0,Math.PI*2);g.stroke();g.restore();disk(p.x-6,p.y-8,4,'#ffffffdd');g.textAlign='left';g.restore()}
function chime(n,beats=1){if(!sound||!ac)return;let z=ac.currentTime,f=440*2**((n-69)/12);for(const [m,a,d] of [[1,.28,Math.max(1.2,beats*beatSeconds*.95)],[2,.07,.5],[3,.02,.25]]){let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f*m;v.gain.setValueAtTime(.0001,z);v.gain.exponentialRampToValueAtTime(a,z+.005);v.gain.exponentialRampToValueAtTime(.0001,z+d);o.connect(v).connect(ac.destination);o.start(z);o.stop(z+d+.01)}}
function reset(){time=0;struck=0;finished=false;running=false;pads.forEach(p=>p.hit=-100);play.textContent='Release marble';status.textContent='The Star-Spangled Banner · tap Release marble'}
function frame(ms){let dt=last===null?0:Math.min(.04,(ms-last)/1000);last=ms;if(running){time=Math.min(total,time+dt*Number(document.querySelector('#speed').value));while(struck<pads.length&&time>=arrivals[struck]){pads[struck].hit=arrivals[struck];chime(pads[struck].note,pads[struck].beats);status.textContent=pads[struck].name+' · note '+(struck+1)+' of '+pads.length;struck++}if(time>=total){running=false;finished=true;play.textContent='Release again';status.textContent='The Star-Spangled Banner · finished'}}draw();requestAnimationFrame(frame)}
play.onclick=async()=>{if(finished)reset();try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){}running=!running;play.textContent=running?'Pause':'Continue';if(!running)status.textContent='Paused'};document.querySelector('#reset').onclick=reset;document.querySelector('#mute').onclick=()=>{sound=!sound;document.querySelector('#mute').textContent=sound?'Mute':'Sound on';document.querySelector('#mute').setAttribute('aria-pressed',String(!sound))};reset();requestAnimationFrame(frame);
})();

</script></body></html>
