 let within=0;for(const token of bars[bar].split(' ')){
 const [name,value]=token.split(':');const length=Number(value);
 const swing=b=>song.straight?b:Math.floor(b)+(b%1===.5?2/3:b%1);
 const duration=swing(within+length)-swing(within);
 melody.push([pitches[name]+(song.transpose||0)+(pass?song.lift:0),duration]);noteChords.push(chords[bar]);within+=length;
 }musicalBeat+=within;
}
const pitchNames=['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'];
const layout=[620,305,715,475,190,605,320,650];

const chordKeys=pads.map((p,i)=>{
  if(melody[i][2])return melody[i][2];
  if(!song.melody)return noteChords[i]==='G'?'Gmajor':noteChords[i];
  if(i===pads.length-1)return 'D';
  const pc=p.note%12;
  if(pc===8)return 'E7';
  if(pc===1||pc===4)return 'A7';
  if(pc===7||pc===11)return 'G';
