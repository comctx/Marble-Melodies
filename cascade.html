<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Note Cascade · Marble Melodies</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171e22;color:#e8e5dc;font:15px system-ui}main{max-width:850px;margin:auto}header{padding:14px 18px 10px}a{color:#bfcacb;font-size:13px}h1{font:29px Georgia;margin:12px 0 6px}p{margin:4px 0;color:#aebbbc;line-height:1.5}canvas{display:block;width:100%;aspect-ratio:900/1000;background:#333f43}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 16px max(18px,env(safe-area-inset-bottom));background:#20292d}button{border:1px solid #627378;border-radius:24px;background:#37484b;color:white;font:15px system-ui;padding:11px 18px}#play{background:#d8b16d;color:#20292d;border-color:#d8b16d}label{font-size:13px;color:#c1ccca;display:flex;align-items:center;gap:7px}input{width:100px;accent-color:#d8b16d}#status{font-size:12px;color:#c2ceca;padding:0 18px 12px}@media(min-width:700px){canvas{max-height:76vh;width:auto;max-width:100%;margin:auto}}</style></head>
<body><main><header><a href="./index.html">← All Marble Melodies machines</a><h1>Note Cascade</h1><p>A falling marble plays Do, Re, Mi—bouncing from one note plate to the next.</p></header><canvas width="900" height="1000" aria-label="One glass marble bouncing down eight musical note plates"></canvas><div class="controls"><button id="play">Drop marble</button><button id="reset">Back to top</button><label>Speed <input id="speed" aria-label="Rolling speed" type="range" min="0.5" max="1.5" step="0.1" value="0.8"></label><button id="mute" aria-pressed="false">Mute</button></div><div id="status" role="status">Ready at the top · tap Drop marble</div></main>
<script>
(()=>{'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d'),play=document.querySelector('#play'),status=document.querySelector('#status');
const names=['Do','Re','Mi','Fa','Sol','La','Ti','Do'],notes=[60,62,64,65,67,69,71,72],colors=['#ba7851','#c58f53','#c7ac60','#8ca66b','#5baba6','#628eaf','#9281b4','#bc83a1'];
const pads=names.map((name,i)=>({name,x:i%2?570:330,y:160+i*96,note:notes[i],hit:-100}));
const radius=18,start={x:330,y:38},end={x:690,y:965};let time=0,last=null,running=false,finished=false,struck=0,sound=true,ac=null;
const first=.72,hop=.88,total=first+7*hop+.8;
function position(t){if(t<first){let u=t/first;return{x:start.x,y:start.y+(pads[0].y-radius-start.y)*u*u}}let k=Math.floor((t-first)/hop);if(k<7){let u=(t-first-k*hop)/hop,a=pads[k],b=pads[k+1];return{x:a.x+(b.x-a.x)*u,y:a.y-radius+(b.y-a.y)*u-145*4*u*(1-u)}}let u=Math.min(1,(t-first-7*hop)/.8),a=pads[7];return{x:a.x+(end.x-a.x)*u,y:a.y-radius+(end.y-radius-a.y+radius)*u-95*4*u*(1-u)}}
function line(ax,ay,bx,by,color,width=2){g.beginPath();g.moveTo(ax,ay);g.lineTo(bx,by);g.strokeStyle=color;g.lineWidth=width;g.stroke()}
function disk(x,y,r,color){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=color;g.fill()}
function draw(){let bg=g.createLinearGradient(0,0,900,1000);bg.addColorStop(0,'#5b696a');bg.addColorStop(1,'#29383e');g.fillStyle=bg;g.fillRect(0,0,900,1000);
for(let i=0;i<pads.length;i++){let p=pads[i],age=time-p.hit,wobble=age>=0&&age<.65?Math.sin(age*19)*Math.exp(-age*6):0;
// A spring-mounted plate rebounds after the impact; its top is the collision surface.
line(p.x-38,p.y+21,p.x-38,p.y+43,'#a4b5b3',5);line(p.x+38,p.y+21,p.x+38,p.y+43,'#a4b5b3',5);line(p.x-48,p.y+43,p.x+48,p.y+43,'#778a89',6);disk(p.x-48,p.y+43,5,'#c1cdca');disk(p.x+48,p.y+43,5,'#c1cdca');
g.save();g.translate(p.x,p.y+8+wobble*7);g.rotate(wobble*(i%2?-.055:.055));g.shadowColor='#0e1b2088';g.shadowBlur=10;g.shadowOffsetX=13;g.shadowOffsetY=16;let wood=g.createLinearGradient(-76,-8,76,12);wood.addColorStop(0,colors[i]);wood.addColorStop(.5,'#e0c39b');wood.addColorStop(1,colors[i]);g.fillStyle=wood;g.fillRect(-76,-8,152,17);g.shadowColor='transparent';g.fillStyle='#655343';g.fillRect(-76,9,152,8);line(-69,-6,69,-6,'#f7e5bd88',2);disk(-61,1,3,'#665c50');disk(61,1,3,'#665c50');g.restore();
g.fillStyle=age>=0&&age<.4?'#ffe6a7':'#c4d0ca';g.font='20px Georgia';g.textAlign=i%2?'left':'right';g.fillText(p.name,p.x+(i%2?101:-101),p.y+9);if(age>=0&&age<.4){g.strokeStyle='#f6d894';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y-radius,25+age*45,Math.PI,Math.PI*2);g.stroke()}}
// Visible catching bowl, so the marble finishes without vanishing.
g.beginPath();g.ellipse(end.x,end.y+9,68,14,0,0,Math.PI);g.fillStyle='#7c9498';g.fill();line(end.x-68,end.y+9,end.x+68,end.y+9,'#d7e0d9',4);
let p=position(time);g.save();g.shadowColor='#08191f88';g.shadowBlur=9;g.shadowOffsetX=7;g.shadowOffsetY=11;let glass=g.createRadialGradient(p.x-6,p.y-8,1,p.x,p.y,radius);glass.addColorStop(0,'#e9ffff');glass.addColorStop(.25,'#67ded6');glass.addColorStop(.75,'#237d9b');glass.addColorStop(1,'#a9e5dc');disk(p.x,p.y,radius,glass);g.restore();g.save();g.beginPath();g.arc(p.x,p.y,radius-1,0,Math.PI*2);g.clip();g.translate(p.x,p.y);g.rotate(time*4);g.strokeStyle='#e8b861';g.lineWidth=6;g.beginPath();g.ellipse(0,0,8,20,.7,0,Math.PI*2);g.stroke();g.restore();disk(p.x-6,p.y-8,4,'#ffffffcf');g.textAlign='left'}
function chime(n){if(!sound||!ac)return;let z=ac.currentTime,f=440*2**((n-69)/12);for(const [multiple,gain,decay] of [[1,.30,1.2],[2,.075,.45],[3,.025,.22]]){let o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f*multiple;v.gain.setValueAtTime(.0001,z);v.gain.exponentialRampToValueAtTime(gain,z+.005);v.gain.exponentialRampToValueAtTime(.0001,z+decay);o.connect(v).connect(ac.destination);o.start(z);o.stop(z+decay+.01)}}
function reset(){time=0;struck=0;finished=false;running=false;pads.forEach(p=>p.hit=-100);play.textContent='Drop marble';status.textContent='Ready · Do → Re → Mi → Fa → Sol → La → Ti → Do'}
function frame(ms){let dt=last===null?0:Math.min(.04,(ms-last)/1000);last=ms;if(running){time=Math.min(total,time+dt*Number(document.querySelector('#speed').value));while(struck<8&&time>=first+struck*hop){let p=pads[struck];p.hit=first+struck*hop;chime(p.note);status.textContent=p.name+' · note '+(struck+1)+' of 8';struck++}if(time>=total){running=false;finished=true;play.textContent='Drop again';status.textContent='Finished · all eight notes played'}}draw();requestAnimationFrame(frame)}
play.onclick=async()=>{if(finished)reset();try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){}running=!running;play.textContent=running?'Pause':'Continue';if(!running)status.textContent='Paused'};
document.querySelector('#reset').onclick=reset;document.querySelector('#mute').onclick=()=>{sound=!sound;document.querySelector('#mute').textContent=sound?'Mute':'Sound on';document.querySelector('#mute').setAttribute('aria-pressed',String(!sound))};reset();requestAnimationFrame(frame);
})();

</script></body></html>
