 const unlock=ac.createBufferSource();unlock.buffer=ac.createBuffer(1,1,ac.sampleRate);
 unlock.connect(ac.destination);unlock.start(0);
 return resume.then(()=>{if(ac.state!=='running')throw new Error('Tap Test sound to enable audio')});
}
function soundError(error){document.querySelector('#status').textContent='SOUND: '+(error.message||'Tap Test sound to retry')}
function setMuted(value){
 muted=value;if(volume&&ac)volume.gain.setValueAtTime(muted?0:.75,ac.currentTime);
 const button=document.querySelector('#sound');button.textContent=muted?'Sound off':'Sound on';button.setAttribute('aria-pressed',String(!muted));
}
document.querySelector('#play').onclick=async()=>{
 try{
  if(running){running=false;document.querySelector('#play').textContent='Start the foundry';document.querySelector('#status').textContent='THE WORKSHOP IS RESTING';return}
  await enableAudio();setMuted(false);audio(72,'bell');
  running=true;last=performance.now();document.querySelector('#play').textContent='Pause the foundry';document.querySelector('#status').textContent='PLAYING · FIRST MARBLE ARRIVES IN 2.5 SECONDS';
 }catch(error){soundError(error)}
};
document.querySelector('#sound').onclick=async()=>{
 try{const next=!muted;if(!next)await enableAudio();setMuted(next);if(!muted)audio(72,'bell')}catch(error){soundError(error)}
};

 try{await enableAudio();setMuted(false);audio(72,'bell');document.querySelector('#status').textContent='SOUND TEST · CHIME PLAYED'}catch(error){soundError(error)}
};
